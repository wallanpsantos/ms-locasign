docs: |
  ### 06 - Reprocessa DLT Kafka - Sucesso (200 OK)
  Executa a rotina operacional de republicação de mensagens retidas na DLT (`locasign.contract.events.v1.dlt`) de volta para o tópico original (`locasign.contract.events.v1`).
  
  **Garantias:**
  - Lock exclusivo via `ReentrantLock` impedindo execuções simultâneas.
  - Limpeza dos cabeçalhos internos de erro da DLT (`kafka_dlt-*`).
  - Preservação da chave de partição e payloads.
  - Commit síncrono de offsets após o reenvio.
  
  - **Sucesso:** `HTTP 200 OK`
  - **Body:** `{"topic": "locasign.contract.events.v1", "replayed": 0}` *(ou total de mensagens reenviadas)*
  
  ```bash
  curl --request POST 'http://localhost:8080/api/v1/admin/dead-letters/locasign.contract.events.v1/replay' \
    --header "X-Admin-Token: {{adminToken}}"
  ```
