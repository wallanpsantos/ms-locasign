  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/v1/contracts/{{contractId}}/history"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  ### 05 - Linha do tempo e histórico (200 OK)
  Retorna a auditoria cronológica completa de todos os eventos do contrato:
  - Criação da versão
  - Transições aplicadas (`APPLIED`)
  - Transições descartadas por desordem ou idempotência (`IGNORED_TRANSITION`, Regra R5)
  - Fatos informativos (`INFO`, como assinaturas individuais)
  - Canal de origem (`API`, `WEBHOOK`, `RECONCILIATION`, `SCHEDULER`)
  
  - **Sucesso:** `HTTP 200 OK`
  
  ```bash
  curl --request GET "http://localhost:8080/api/v1/contracts/{{contractId}}/history"
  ```
