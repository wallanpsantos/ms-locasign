docs: |
  ### 27 - Reprocessa DLT Kafka - Erro 403 (Token ausente ou inválido)
  A republicação de mensagens envenenadas ou em falha contínua da fila DLT (Dead Letter Topic) é uma ação operacional sensível.
  O `OperatorAccessGuard` rejeita a execução quando o cabeçalho `X-Admin-Token` não é fornecido.
  
  - **Erro esperado:** `HTTP 403 FORBIDDEN`
  - **Mensagem:** "Operação restrita a operadores."
  
  ```bash
  curl --request POST 'http://localhost:8080/api/v1/admin/dead-letters/locasign.contract.events.v1/replay'
  ```
