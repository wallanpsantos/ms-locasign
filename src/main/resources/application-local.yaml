# Perfil de desenvolvimento: app rodando na IDE, infraestrutura no Docker Compose.
# Uso: gradlew clean build bootRun --args='--spring.profiles.active=local'
management:
  endpoint:
    health:
      show-details: always

# Habilita cores ANSI no console mesmo no terminal integrado da IDE ou PowerShell
spring:
  output:
    ansi:
      enabled: ALWAYS

logging:
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level) %clr([%15.15t]){faint} %clr([%X{correlationId:-none}]){magenta} %clr(%-38.38logger{37}){cyan} %clr(:){faint} %m%n%wEx"
  level:
    br.com.locasign: DEBUG
    org.apache.kafka: WARN

