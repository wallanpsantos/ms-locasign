docs: |
  ### 01 - Força reconciliação PandaDoc - Erro 403 (Token ausente ou inválido)
  A reconciliação manual consome cota direta de requisições por minuto da API da PandaDoc (rate limit).
  O `OperatorAccessGuard` aplica segurança em tempo constante fail-closed (ADR-013). Sem o token correto no cabeçalho `X-Admin-Token`, o acesso é bloqueado.
  
  - **Erro esperado:** `HTTP 403 FORBIDDEN`
  - **Mensagem:** "Operação restrita a operadores."
  
  ```bash
  curl --request POST "http://localhost:8080/api/v1/contracts/{{contractId}}/reconcile"
  ```
