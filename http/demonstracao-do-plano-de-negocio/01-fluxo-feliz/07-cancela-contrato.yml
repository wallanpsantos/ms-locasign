settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  ### 07 - Cancela o contrato formalmente (202 Accepted)
  Cancela formalmente o contrato ativo na aplicação (Regra **R9**).
  
  **Efeitos de Negócio e Domínio:**
  - O contrato transiciona para o status terminal `CANCELLED` de forma atômica.
  - A justificativa é persistida na trilha histórica de auditoria.
  - Caso o documento já estivesse na PandaDoc, é anulado remotamente em melhor esforço.
  - A locação é liberada para a geração de uma nova versão (Regra R1).
  
  - **Sucesso:** `HTTP 202 ACCEPTED`
  - **Body:** `{"id": "...", "leaseId": null, "status": "CANCELLED"}`
  
  ```bash
  curl --request POST "http://localhost:8080/api/v1/contracts/{{contractId}}/cancel" \
    --header 'Content-Type: application/json' \
    --data '{"reason": "Dados do locatário precisam de correção (ajuste formal de prazo e valores)"}'
  ```
