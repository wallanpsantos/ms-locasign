info:
  name: 01 - Cadastra locação - Erro 400 (Campos obrigatórios ou inválidos)
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/leases"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "tenant": {
          "name": "",
          "cpf": "",
          "email": ""
        },
        "property": {
          "address": ""
        },
        "rentAmount": "",
        "startDate": "2026-11-01",
        "termMonths": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  ### 01 - Cadastra locação - Erro 400 (Campos obrigatórios ou inválidos)
  Envia dados sintaticamente incompletos violando anotações do Bean Validation:
  - `tenant.name`: em branco / menor que 3 caracteres
  - `property.address`: em branco
  - `rentAmount`: em branco
  - `termMonths`: abaixo do limite mínimo (mínimo 1)
  
  - **Erro esperado:** `HTTP 400 BAD REQUEST`
  - **Formato:** RFC 9457 Problem Details com `type: /problems/validation` e lista detalhada de erros por campo.
  
  ```bash
  curl --request POST 'http://localhost:8080/api/v1/leases' \
    --header 'Content-Type: application/json' \
    --data '{
      "tenant": { "name": "", "cpf": "", "email": "" },
      "property": { "address": "" },
      "rentAmount": "",
      "startDate": "2026-11-01",
      "termMonths": 0
    }'
  ```
