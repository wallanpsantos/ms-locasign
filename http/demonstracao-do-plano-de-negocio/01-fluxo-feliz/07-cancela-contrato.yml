http:
  method: POST
  url: "{{baseUrl}}/api/v1/contracts/{{contractId}}/cancel"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "reason": "Dados do locatário precisam de correção (ajuste formal de prazo e valores)"
      }
