name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # Compila, roda os testes (incluindo os de arquitetura, quando existirem) e gera o jar.
      - name: Build
        run: ./gradlew build --no-daemon

      - name: Valida o compose.yml
        run: docker compose config --quiet
