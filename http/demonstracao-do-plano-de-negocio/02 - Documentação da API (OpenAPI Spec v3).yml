http:
  method: GET
  url: "{{baseUrl}}/v3/api-docs"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  ### 02 - Documentação da API (OpenAPI Spec v3)
  Recupera a especificação técnica formal dos contratos REST em formato OpenAPI 3.1 JSON.
  A interface Swagger UI correspondente pode ser visualizada no navegador em `http://localhost:8080/swagger-ui.html`.
  
  - **Sucesso:** `HTTP 200 OK`
  
  ```bash
  curl --request GET 'http://localhost:8080/v3/api-docs'
  ```
