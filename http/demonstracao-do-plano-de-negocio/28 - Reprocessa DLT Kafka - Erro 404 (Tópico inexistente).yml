docs: |
  ### 28 - Reprocessa DLT Kafka - Erro 404 (Tópico inexistente)
  Informa um nome de tópico de origem que não faz parte do catálogo canônico do sistema (`Topics.ALL`: `locasign.pandadoc.webhooks.v1`, `locasign.contract.events.v1`).
  O `DeadLetterReplayer` valida o tópico contra a lista permitida e lança `DomainException.NotFound`.
  
  - **Erro esperado:** `HTTP 404 NOT FOUND`
  - **Formato:** RFC 9457 Problem Details com `type: /problems/not-found`.
  
  ```bash
  curl --request POST 'http://localhost:8080/api/v1/admin/dead-letters/topico.inexistente.v1/replay' \
    --header "X-Admin-Token: {{adminToken}}"
  ```
