docs: |
  ### 07 - Cadastra a locação - Erro 422 (Regra R2 - Aluguel zerado ou negativo)
  A regra de negócio **R2** exige valor de aluguel estritamente positivo (maior que zero).
  O value object `Money.positive` rejeita valores zerados ou negativos para proteger a integridade financeira do contrato.
  
  - **Erro esperado:** `HTTP 422 UNPROCESSABLE CONTENT`
  - **Formato:** RFC 9457 Problem Details com `type: /problems/business-rule` e atributo `"field": "rentAmount"`.
  
  ```bash
  curl --request POST 'http://localhost:8080/api/v1/leases' \
    --header 'Content-Type: application/json' \
    --data '{
      "tenant": {
        "name": "Roberto Souza",
        "cpf": "529.982.247-25",
        "email": "roberto@example.com"
      },
      "agencySigner": {
        "name": "Imobiliária Exemplo",
        "email": "agencia@example.com"
      },
      "property": {
        "address": "Rua Oscar Freire, 200, São Paulo/SP"
      },
      "rentAmount": "0.00",
      "startDate": "2026-11-01",
      "termMonths": 30
    }'
  ```
