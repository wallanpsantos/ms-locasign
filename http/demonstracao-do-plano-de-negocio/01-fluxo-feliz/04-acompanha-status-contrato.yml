http:
  method: GET
  url: "{{baseUrl}}/api/v1/contracts/{{contractId}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  ### 04 - Acompanha o status do contrato (200 OK)
  Consulta os detalhes do contrato, refletindo em tempo real seu estado no ciclo de vida:
  `DRAFT` -> `GENERATED` -> `SENT` -> `VIEWED` -> `PARTIALLY_SIGNED` -> `COMPLETED`.
  
  Exibe a ordem regulamentar de assinaturas (R3: locatário primeiro, imobiliária depois), dados mascarados (LGPD) e prazo limite (7 dias, R4).
  
  - **Sucesso:** `HTTP 200 OK`
  
  ```bash
  curl --request GET "http://localhost:8080/api/v1/contracts/{{contractId}}"
  ```
