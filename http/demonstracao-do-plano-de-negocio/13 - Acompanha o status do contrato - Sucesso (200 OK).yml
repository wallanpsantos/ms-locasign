docs: |
  ### 13 - Acompanha o status do contrato - Sucesso (200 OK)
  Consulta os detalhes do contrato, refletindo em tempo real seu estado no ciclo de vida:
  `DRAFT` -> `GENERATED` -> `SENT` -> `VIEWED` -> `PARTIALLY_SIGNED` -> `COMPLETED`.
  
  Também expõe a lista de signatários com suas ordens de assinatura (R3: locatário primeiro, imobiliária depois), dados mascarados (LGPD) e datas limite de assinatura (prazo de 7 dias, R4).
  
  - **Sucesso:** `HTTP 200 OK`
  
  ```bash
  curl --request GET "http://localhost:8080/api/v1/contracts/{{contractId}}"
  ```
