docs: |
  ### 05 - Cadastra a locação - Erro 422 (Regra R2 - CPF inválido)
  Valida o domínio e integridade de dados do locatário (Regra **R2**).
  Embora o campo esteja preenchido, o CPF com dígitos repetidos `111.111.111-11` falha no algoritmo de validação do value object `Cpf`.
  
  - **Erro esperado:** `HTTP 422 UNPROCESSABLE CONTENT`
  - **Formato:** RFC 9457 Problem Details com `type: /problems/business-rule` e atributo `"field": "tenant.cpf"`.
  
  ```bash
  curl --request POST 'http://localhost:8080/api/v1/leases' \
    --header 'Content-Type: application/json' \
    --data '{
      "tenant": {
        "name": "Carlos Eduardo",
        "cpf": "111.111.111-11",
        "email": "carlos@example.com"
      },
      "agencySigner": {
        "name": "Imobiliária Exemplo",
        "email": "agencia@example.com"
      },
      "property": {
        "address": "Av. Paulista, 1000, Apto 42, São Paulo/SP"
      },
      "rentAmount": "3200.00",
      "startDate": "2026-11-01",
      "termMonths": 30
    }'
  ```
