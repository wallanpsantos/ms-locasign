docs: |
  ### 08 - Acompanha status - Erro 404 (Contrato inexistente)
  Consulta um identificador de contrato que não existe na base de dados.
  
  - **Erro esperado:** `HTTP 404 NOT FOUND`
  - **Formato:** RFC 9457 Problem Details com `type: /problems/not-found`.
  
  ```bash
  curl --request GET 'http://localhost:8080/api/v1/contracts/00000000-0000-0000-0000-000000000000'
  ```
