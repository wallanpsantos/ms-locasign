docs: |
  ### 29 - Reprocessa DLT Kafka - Sucesso (200 OK)
  Executa a rotina operacional de esvaziamento e reenvio de mensagens da Dead Letter Queue (`locasign.contract.events.v1.dlt`) de volta para o tópico original (`locasign.contract.events.v1`).
  
  **Garantias da Rotina:**
  - Exclusão mútua via `ReentrantLock` impedindo execuções concorrentes.
  - Limpeza dos cabeçalhos internos de erro da DLT (`kafka_dlt-*`).
  - Preservação da chave de partição e ordem original.
  - Commit síncrono dos offsets apenas após confirmação de entrega pelo broker.
  
  - **Sucesso:** `HTTP 200 OK`
  - **Body:** `{"topic": "locasign.contract.events.v1", "replayed": 0}` *(ou quantidade de mensagens reenviadas)*
  
  ```bash
  curl --request POST 'http://localhost:8080/api/v1/admin/dead-letters/locasign.contract.events.v1/replay' \
    --header "X-Admin-Token: {{adminToken}}"
  ```
