docs: |
  ### 06 - Solicita contrato - Erro 404 (Locação inexistente)
  Tenta solicitar contrato para um identificador de locação inexistente.
  
  - **Erro esperado:** `HTTP 404 NOT FOUND`
  - **Formato:** RFC 9457 Problem Details com `type: /problems/not-found`.
  
  ```bash
  curl --request POST 'http://localhost:8080/api/v1/leases/00000000-0000-0000-0000-000000000000/contracts'
  ```
