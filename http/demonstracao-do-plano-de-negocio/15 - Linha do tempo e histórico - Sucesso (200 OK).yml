docs: |
  ### 15 - Linha do tempo e histórico - Sucesso (200 OK)
  Retorna a auditoria cronológica completa de todos os fatos e mudanças de estado ocorridos no contrato:
  - Criação da versão
  - Transições aplicadas (`APPLIED`)
  - Transições descartadas por desordem ou idempotência (`IGNORED_TRANSITION`, Regra R5)
  - Fatos informativos (`INFO`, como assinaturas de signatários individuais)
  - Origem da mudança (`API`, `WEBHOOK`, `RECONCILIATION`, `SCHEDULER`)
  
  - **Sucesso:** `HTTP 200 OK`
  
  ```bash
  curl --request GET "http://localhost:8080/api/v1/contracts/{{contractId}}/history"
  ```
