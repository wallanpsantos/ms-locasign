http:
  method: GET
  url: "{{baseUrl}}/api/v1/leases/{{leaseId}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  ### 02 - Consulta a locação (200 OK)
  Recupera os dados completos da locação recém-cadastrada (`REGISTERED`), com endereço do imóvel, inquilino (CPF mascarado conforme LGPD) e dados do contrato ativo quando houver.
  
  - **Sucesso:** `HTTP 200 OK`
  
  ```bash
  curl --request GET "http://localhost:8080/api/v1/leases/{{leaseId}}"
  ```
