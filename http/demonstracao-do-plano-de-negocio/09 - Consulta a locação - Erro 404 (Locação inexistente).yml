docs: |
  ### 09 - Consulta a locação - Erro 404 (Locação inexistente)
  Consulta um UUID de locação inexistente no banco de dados.
  
  - **Erro esperado:** `HTTP 404 NOT FOUND`
  - **Formato:** RFC 9457 Problem Details com `type: /problems/not-found` e mensagem padronizada em pt-BR.
  
  ```bash
  curl --request GET 'http://localhost:8080/api/v1/leases/00000000-0000-0000-0000-000000000000'
  ```
