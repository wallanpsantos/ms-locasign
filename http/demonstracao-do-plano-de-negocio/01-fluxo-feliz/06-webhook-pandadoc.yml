info:
  name: 06 - Webhook PandaDoc - Evento assinado (200 OK)
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/webhooks/pandadoc"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-PandaDoc-Webhook-Event-Id
      value: delivery-demo-001
  body:
    type: json
    data: |-
      [
        {
          "event": "document_state_changed",
          "data": {
            "id": "doc_pandadoc_demo_123",
            "name": "LocaSign contrato residencial",
            "date_modified": "2026-10-15T10:00:00.000000Z",
            "status": "document.viewed",
            "metadata": {
              "contract_id": "{{contractId}}"
            },
            "recipients": [
              {
                "email": "maria@example.com",
                "role": "Locatario",
                "has_completed": false
              },
              {
                "email": "agencia@example.com",
                "role": "Imobiliaria",
                "has_completed": false
              }
            ]
          }
        }
      ]
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const crypto = require("crypto");
        const targetContractId = bru.getVar("contractId") || bru.getEnvVar("contractId");
        console.log("Disparando webhook simulado PandaDoc para o contractId:", targetContractId);

        const secret = bru.getEnvVar("webhookSharedKey") || "segredo";
        const rawBody = req.getBody();
        const bodyStr = typeof rawBody === "string" ? rawBody : JSON.stringify(rawBody);
        const signature = crypto.createHmac("sha256", secret).update(bodyStr).digest("hex");
        const base = bru.getEnvVar("baseUrl") || "http://localhost:8080";
        req.setUrl(base + "/webhooks/pandadoc?signature=" + signature);
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          console.log("Webhook PandaDoc recebido com sucesso (HTTP 200). Gravado no inbox para processamento assíncrono (R7).");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  ### 06 - Webhook PandaDoc - Evento assinado (200 OK)
  Simula a recepção de webhook da PandaDoc notificando alteração de estado (`document_state_changed`).
  
  **Assinatura Criptográfica HMAC-SHA256 Automática:**
  - O script *Pre-Request* calcula automaticamente a assinatura HMAC-SHA256 sobre o corpo e injeta o parâmetro `?signature=...` na URL, utilizando a chave `webhookSharedKey` (padrão: `segredo`).
  - O backend valida os bytes exatos e registra a entrega bruta no `webhook_inbox` antes de responder HTTP 200 (Regra R7).
  
  **Como testar a Conclusão / Assinatura Completa (Regra R8):**
  - No corpo da requisição acima, altere `"status": "document.viewed"` para `"status": "document.completed"` e marque `"has_completed": true` para os signatários.
  - Ao enviar, o contrato transiciona para `COMPLETED`, o consumidor Kafka é acionado e a locação transiciona automaticamente para `ACTIVE`!
  
  ```bash
  # Exemplo cURL com assinatura HMAC gerada manualmente:
  key="segredo"
  body='[{"event":"document_state_changed","data":{"id":"doc_123","status":"document.viewed","metadata":{"contract_id":"'{{contractId}}'"},"recipients":[]}}]'
  sig=$(echo -n "$body" | openssl dgst -sha256 -hmac "$key" -hex | sed 's/^.* //')
  curl -i -X POST "http://localhost:8080/webhooks/pandadoc?signature=$sig" \
    -H "Content-Type: application/json" \
    -H "X-PandaDoc-Webhook-Event-Id: $(uuidgen)" \
    -d "$body"
  ```
