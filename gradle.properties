# ── Gradle Configuration Cache ──────────────────────────────────────────────
# Habilita o Configuration Cache persistentemente (Gradle 9.x preferred mode)
org.gradle.configuration-cache=true
#
# Paraleliza a serialização/desserialização do grafo de tasks no disco
# Desative se ocorrer race condition ou falha durante store/load do cache
org.gradle.configuration-cache.parallel=true
#
# ── Build Cache ──────────────────────────────────────────────────────────────
# Reutiliza outputs de tasks anteriores com base em inputs (complementar ao CC)
org.gradle.caching=true
#
# ── Performance geral ────────────────────────────────────────────────────────
# Mantém o processo Gradle ativo entre builds, evitando JVM cold start
# (padrão true desde Gradle 3+, declarado aqui para clareza explícita)
org.gradle.daemon=true
#
# Executa tasks de projetos independentes em paralelo
org.gradle.parallel=true
#
# ── Troubleshooting do Configuration Cache ───────────────────────────────────
# Detecta inconsistências de serialização antecipadamente durante store/load
# Use pontualmente via CLI: ./gradlew build -Dorg.gradle.configuration-cache.integrity-check=true
# Não deixe permanente: gera overhead de performance e aumenta o tamanho do cache em disco
# org.gradle.configuration-cache.integrity-check=true
